<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTrack — Daily Activity Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-left">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 20V10"/>
          <path d="M12 20V4"/>
          <path d="M6 20v-6"/>
        </svg>
        <h1 class="logo-text">FitTrack</h1>
      </div>
      <p class="header-subtitle">Daily Activity Dashboard</p>
    </div>
    <div class="header-right">
      <label for="date-picker" class="date-label">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <input type="date" id="date-picker">
      </label>
    </div>
  </header>

  <!-- ===== MAIN DASHBOARD ===== -->
  <main class="dashboard">

    <!-- ---- Step Counter Card ---- -->
    <section class="card step-card" aria-label="Step Counter">
      <h2 class="card-title">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
          <line x1="4" y1="22" x2="4" y2="15"/>
        </svg>
        Step Counter
      </h2>

      <div class="progress-ring-container">
        <svg class="progress-ring" viewBox="0 0 160 160">
          <circle class="progress-ring-bg" cx="80" cy="80" r="70"/>
          <circle class="progress-ring-fill" id="progress-circle" cx="80" cy="80" r="70"/>
        </svg>
        <div class="progress-ring-text">
          <span class="step-count" id="step-count">0</span>
          <span class="step-label">steps</span>
        </div>
      </div>

      <div class="step-info">
        <div class="step-goal-display">
          <span class="info-label">Goal</span>
          <span class="info-value" id="step-goal-display">10,000</span>
        </div>
        <div class="step-percent-display">
          <span class="info-label">Progress</span>
          <span class="info-value percent-badge" id="step-percent">0%</span>
        </div>
      </div>

      <div class="step-controls">
        <div class="input-group">
          <input type="number" id="add-steps-input" placeholder="Add steps" min="1" max="100000" aria-label="Number of steps to add">
          <button class="btn btn-primary" id="add-steps-btn" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Add
          </button>
        </div>
        <div class="input-group input-group-secondary">
          <input type="number" id="set-goal-input" placeholder="Set goal" min="1" max="1000000" aria-label="Daily step goal">
          <button class="btn btn-outline" id="set-goal-btn" type="button">Set Goal</button>
        </div>
      </div>
    </section>

    <!-- ---- Record Activity Card ---- -->
    <section class="card form-card" aria-label="Record Activity">
      <h2 class="card-title">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
        Record Activity
      </h2>
      <form id="activity-form" novalidate>
        <div class="form-group">
          <label for="activity-type">Activity Type</label>
          <select id="activity-type" required>
            <option value="" disabled selected>Choose activity…</option>
            <option value="Walking">🚶 Walking</option>
            <option value="Running">🏃 Running</option>
            <option value="Cycling">🚴 Cycling</option>
            <option value="Swimming">🏊 Swimming</option>
            <option value="Other">⚡ Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="activity-duration">Duration (minutes)</label>
          <input type="number" id="activity-duration" placeholder="e.g. 30" min="1" max="1440" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Record Activity
        </button>
      </form>
    </section>

    <!-- ---- Activity Summary Card ---- -->
    <section class="card summary-card" aria-label="Activity Summary">
      <h2 class="card-title">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        Activity Summary
      </h2>
      <div id="summary-container" class="summary-container">
        <!-- Rendered by JS -->
      </div>
      <div class="summary-total">
        <span class="total-label">Total Duration</span>
        <span class="total-value" id="total-duration">0 min</span>
      </div>
    </section>

    <!-- ---- Recent Activities Card ---- -->
    <section class="card recent-card" aria-label="Recent Activities">
      <h2 class="card-title">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        Recent Activities
      </h2>
      <div id="recent-list" class="recent-list">
        <!-- Rendered by JS -->
      </div>
    </section>

  </main>

  <!-- ===== TOAST NOTIFICATION ===== -->
  <div id="notification" class="notification" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
